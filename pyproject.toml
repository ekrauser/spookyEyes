[project]
name = "spookyeyes"
version = "0.1.0"
description = "Dual round-display animated Halloween eyes for Raspberry Pi (GC9A01A / EYESPI)"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
pir = ["gpiozero"]
preview = ["pygame"]
dev = ["pytest"]

[project.scripts]
spookyeyes = "spookyeyes.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
